<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Zone2560</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        
        :root {
            --white: #FFFFFF;
            --light-grey: #F4F5F6;
            --fresh-blue: #3A98D8;
            --amber: #FFEB3B;
            --charcoal: #1E293B;
            --charcoal-rgb: 30, 41, 59;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            background-color: var(--light-grey);
            color: var(--charcoal);
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
        }

        h1, h2, h3 { font-family: 'Poppins', Arial, sans-serif; }
        a { text-decoration: none; }

        
        .utility-bar {
            background-color: var(--white);
            color: var(--charcoal);
            font-family: 'Roboto', Arial, sans-serif;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            box-shadow: 0 2px 4px rgba(var(--charcoal-rgb),0.08);
            position: relative;
            z-index: 10;
        }
        
        .utility-bar .left-text { flex: 1; font-weight: bold; }
        .logo-center { flex: 1; text-align: center; }
        .logo-center img { width: 58px; height: 58px; object-fit: contain; }

        .utility-bar .right-links { flex: 1; text-align: right; }
        .utility-bar .right-links a {
            color: var(--charcoal);
            margin-left: 15px;
            font-weight: bold;
        }
        .utility-bar .right-links a:hover { color: var(--fresh-blue); text-decoration: underline; }

        
        .main-nav {
            background-color: var(--white); 
            font-family: 'Roboto', Arial, sans-serif;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 48px;
            box-shadow: 0 4px 6px rgba(var(--charcoal-rgb),0.12);
            position: relative;
            z-index: 9;
        }

        .home-link {
            color: var(--fresh-blue);
            font-weight: bold;
            font-size: 15px;
        }
        .home-link:hover { color: var(--light-grey); }

        .nav-links { display: flex; gap: 28px; align-items: center; }
        .nav-links a { color: var(--fresh-blue); font-weight: bold; font-size: 14px; }
        .nav-links a:hover { color: var(--light-grey); }
        
        .btn-report {
            background-color: var(--fresh-blue);
            color: #FFEB3B !important;
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid var(--fresh-blue);
            transition: all 0.3s ease;
        }
        .btn-report:hover { background-color: var(--light-grey); border-color: var(--light-grey); color: var(--fresh-blue) !important; }

        
        .login-wrapper {
            flex: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(var(--charcoal-rgb), 0.08);
            box-sizing: border-box;
        }

        .login-container h2 {
            color: var(--charcoal);
            text-align: left;
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 24px;
        }

        .login-subtitle {
            margin: 0 0 25px;
            color: var(--charcoal);
            font-size: 14px;
        }
        .login-subtitle strong {
            font-size: 18px;
        }
        .create-account-text {
            color: var(--fresh-blue);
        }

        
        .form-group { margin-bottom: 20px; }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--charcoal);
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--fresh-blue);
            box-shadow: 0 0 5px rgba(58, 152, 216, 0.2);
        }

        
        .btn-submit {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--fresh-blue);
            color: var(--light-grey);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            text-decoration: none;
        }
        
        .btn-submit:hover { background-color: var(--charcoal); }

        #login-status {
            min-height: 20px;
            margin: 12px 0 0;
            color: var(--charcoal);
            font-size: 13px;
            text-align: center;
        }

        
        .legal-text {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        .legal-text a {
            color: var(--fresh-blue);
            font-weight: bold;
        }
        .legal-text a:hover { text-decoration: underline; }

        
        footer {
            background-color: var(--charcoal);
            color: var(--white);
            font-family: 'Roboto', Arial, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            border-top: 4px solid var(--fresh-blue);
        }
        .footer-links a { color: var(--white); margin-right: 20px; font-size: 14px; text-decoration: none; }
        .footer-links a:hover { color: var(--amber); text-decoration: underline; }
        .footer-logo img { display: block; width: 60px; height: 60px; object-fit: contain; }

        
        @media (max-width: 700px) {
            .utility-bar { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
            .left-text, .logo-center, .utility-bar .right-links { flex: 1 1 100%; text-align: center; }
            .utility-bar .right-links a { display: inline-block; margin: 5px 8px; }
            .main-nav { flex-wrap: wrap; justify-content: center; gap: 12px; }
            .nav-links { flex: 1 1 100%; flex-wrap: wrap; justify-content: center; gap: 12px; }
            .login-container { padding: 25px; }
            footer { flex-direction: column; gap: 15px; text-align: center; }
            .footer-links a { display: inline-block; margin: 5px 10px; }
        }
    </style>
</head>
<body>

    
    <div class="utility-bar">
        <div class="left-text">The official website of Kawempe Division</div>
        <div class="logo-center">
            <img src="zone2560-logo.jpeg" alt="Zone 2560 Logo">
        </div>
        <div class="right-links">
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="admin%20login.html" aria-current="page">Admin Login</a>
        </div>
    </div>

    
    <nav class="main-nav">
        <a href="index.html" class="home-link">Home</a>
        <div class="nav-links">
            <a href="waste_tips.html">Waste Tips</a>
            <a href="track.html">Track Reports</a>
            <a href="report.html" class="btn-report">Report Garbage</a>
        </div>
    </nav>


    <main class="login-wrapper">
        <div class="login-container">
            <h2>Admin Login</h2>
            <p class="login-subtitle">
                <strong>Sign In</strong> or <span class="create-account-text">create an account</span>
            </p>

            <div class="admin-login-fields">
            <div class="form-group">
                <label for="email">Your email</label>
                <input type="email" id="email" name="email" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password">
            </div>

            <a class="btn-submit" href="admin%20dashboard.html">Sign In</a>
            </div>

            
            <p class="legal-text">
                By signing in you agree to our<br>
                <a href="privacy.html">Privacy Policy</a>.
            </p>
        </main>
    </div>

    
    <footer>
        <div class="footer-links">
            <a href="about.html">About & Contact</a>
            <a href="privacy.html">Privacy Policy</a>
        </div>
        <div class="footer-logo">
            <img src="zone2560-logo.jpeg" alt="Zone 2560 Logo">
        </div>
    </footer>

</body>
</html>
