<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Garbage - Zone2560</title>
    <style>
        @font-face {
            font-family: 'Roboto';
            src: url('fonts/Roboto.ttf') format('truetype');
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
        }

        @font-face {
            font-family: 'Poppins';
            src: url('fonts/Poppins-Regular.ttf') format('truetype');
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Poppins';
            src: url('fonts/Poppins-Bold.ttf') format('truetype');
            font-style: normal;
            font-weight: 700;
            font-display: swap;
        }

        
        :root {
            --white: #FFFFFF;
            --light-grey: #F4F5F6;
            --fresh-blue: #3A98D8;
            --amber: #FFEB3B;
            --charcoal: #1E293B;
            --charcoal-rgb: 30, 41, 59;
        }

        body {
            font-family: 'Roboto';
            margin: 0;
            background-color: var(--light-grey);
            color: var(--charcoal);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Poppins';
            font-weight: 700;
        }

        a { text-decoration: none; }

        
        .site-header { position: sticky; top: 0; z-index: 20; }
        
        .utility-bar {
            background-color: var(--white); padding: 16px 30px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; box-shadow: 0 2px 4px rgba(var(--charcoal-rgb),0.08);
        }
        .utility-bar .left-text { flex: 1; font-weight: bold; }
        .logo-center { flex: 1; text-align: center; }
        .logo-center img { width: 58px; height: 58px; object-fit: contain; }
        .utility-bar .right-links { flex: 1; text-align: right; }
        .utility-bar .right-links a { color: var(--charcoal); margin-left: 15px; font-weight: bold; }
        .utility-bar .right-links a:hover { color: var(--fresh-blue); }

        .main-nav {
            background-color: var(--white); padding: 15px 20px;
            display: flex; justify-content: center; align-items: center; gap: 48px;
            box-shadow: 0 4px 6px rgba(var(--charcoal-rgb),0.12);
        }
        .home-link { color: var(--fresh-blue); font-weight: bold; font-size: 15px; }
        .nav-links { display: flex; gap: 28px; align-items: center; }
        .nav-links a { color: var(--fresh-blue); font-weight: bold; font-size: 14px; }
        .btn-report {
            background-color: var(--fresh-blue); color: #FFEB3B !important;
            padding: 8px 20px; border-radius: 20px; border: 2px solid var(--fresh-blue);
        }

        
        .form-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .report-container {
            background: var(--white);
            width: 100%;
            max-width: 550px;
            
            padding: 0 40px 30px 40px; 
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(var(--charcoal-rgb), 0.08);
            box-sizing: border-box;
            overflow: hidden; 
        }

        
        .report-container h2 {
            text-align: center;
            color: var(--white);
            background-color: var(--fresh-blue);
            /* Negative margin stretches it to the edges of the container */
            margin: 0 -40px 25px -40px; 
            padding: 20px;
            font-size: 24px;
        }

        .form-notice {
            margin: -8px 0 20px;
            text-align: center;
            font-size: 14px;
        }

        
        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--charcoal);
            font-size: 15px;
        }

        .form-group select, 
        .form-group textarea,
        .form-group input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            background-color: #fafafa;
        }

        .form-group select:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--fresh-blue);
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        
        .btn-submit {
            display: block;
            width: 100%;
            max-width: 150px;
            margin-left: auto; 
            padding: 12px;
            background: linear-gradient(135deg, var(--fresh-blue), #236FAE);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.3px;
            cursor: not-allowed;
            text-align: center;
            box-shadow: 0 6px 16px rgba(58, 152, 216, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-submit:disabled { opacity: 1; }

        
        footer {
            background-color: var(--charcoal); color: var(--white);
            padding: 30px 20px; display: flex; justify-content: space-between; align-items: center;
            border-top: 4px solid var(--fresh-blue);
        }
        .footer-links a { color: var(--white); margin-right: 20px; font-size: 14px; }
        .footer-logo img { width: 60px; height: 60px; object-fit: contain; }

        
        @media (max-width: 700px) {
            .utility-bar { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
            .left-text, .logo-center, .utility-bar .right-links { flex: 1 1 100%; text-align: center; }
            .utility-bar .right-links a { display: inline-block; margin: 5px 8px; }
            .main-nav { flex-wrap: wrap; justify-content: center; gap: 12px; }
            .nav-links { flex: 1 1 100%; flex-wrap: wrap; justify-content: center; gap: 12px; }
            .report-container h2 { margin: 0 -20px 20px -20px; padding: 15px; }
            .report-container { padding: 0 20px 20px 20px; }
            footer { flex-direction: column; gap: 15px; text-align: center; }
            .footer-links a { display: inline-block; margin: 5px 10px; }
        }
    </style>
</head>
<body>

    
    <header class="site-header">
        <div class="utility-bar">
            <div class="left-text">This site is for reporting garbage in Kawempe only</div>
            <div class="logo-center"><img src="zone2560-logo.jpeg" alt="Logo"></div>
            <div class="right-links">
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact Us</a>
                <a href="admin%20login.html">Admin Login</a>
            </div>
        </div>
        <nav class="main-nav">
            <a href="index.html" class="home-link">Home</a>
            <div class="nav-links">
                <a href="waste_tips.html">Waste Tips</a>
                <a href="track%20reports.html">Track Reports</a>
                <a href="report%20garbage.html" class="btn-report">Report Garbage</a>
            </div>
        </nav>
    </header>

    
    <div class="form-wrapper">
        <div class="report-container">
            
            <h2>Report Garbage</h2>
            <p class="form-notice">This is a visual demo. Reports are not submitted.</p>
            <div>
                
                <div class="form-group">
                    <label for="zone">Parish or zone (Enter location)</label>
                    <select id="zone">
                        <option value="" disabled selected></option>
                        <option value="kawempe-a">Kawempe Zone A</option>
                        <option value="bwaise">Bwaise</option>
                        <option value="mpererwe">Mpererwe</option>
                        <option value="kanyanya">Kanyanya</option>
                        <option value="kawempe-b">Kawempe Zone B</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="landmark">Nearby landmark</label>
                    <select id="landmark">
                        <option value="" disabled selected></option>
                        <option value="market">Main Market</option>
                        <option value="school">Primary School</option>
                        <option value="church">Church / Mosque</option>
                        <option value="road">Main Road</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description"></textarea>
                </div>

                <div class="form-group">
                    <label for="photo">Or report with a photo</label>
                    <input type="file" id="photo" accept="image/*">
                </div>

                
                <button type="button" class="btn-submit" disabled>Submit</button>

            </div>
        </div>

    </div>

    <footer>
        <div class="footer-links">
            <a href="about.html">About</a> <span aria-hidden="true">|</span>
            <a href="contact.html">Contact</a>
            <a href="privacy.html">Privacy Policy</a>
        </div>
        <div class="footer-logo">
            <img src="zone2560-logo.jpeg" alt="Logo">
        </div>
    </footer>

</body>
</html>
