<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Garbage - Zone2560</title>
    <link rel="stylesheet" href="style.css">
    <style>



        body {
            font-family: 'Roboto';
            margin: 0;
            background-color: #F4F5F6;
            color: #1E293B;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Poppins';
            font-weight: 700;
        }

        a { text-decoration: none; }


        .site-header { position: sticky; top: 0; z-index: 20; }

        .utility-bar {
            background-color: #FFFFFF; padding: 16px 30px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; box-shadow: 0 2px 4px #1E293B14;
        }
        .utility-bar .left-text { flex: 1; font-weight: bold; }
        .logo-center { flex: 1; text-align: center; }
        .logo-center img { width: 58px; height: 58px; object-fit: contain; }
        .utility-bar .right-links { flex: 1; text-align: right; }
        .utility-bar .right-links a { color: #1E293B; margin-left: 15px; font-weight: bold; }
        .utility-bar .right-links a:hover { color: #3A98D8; }

        .main-nav {
            background-color: #FFFFFF; padding: 15px 20px;
            display: flex; justify-content: center; align-items: center; gap: 48px;
            box-shadow: 0 4px 6px #1E293B1F;
        }
        .home-link { color: #3A98D8; font-weight: bold; font-size: 15px; }
        .nav-links { display: flex; gap: 28px; align-items: center; }
        .nav-links a { color: #3A98D8; font-weight: bold; font-size: 14px; }
        .btn-report {
            background-color: #3A98D8; color: #FFEB3B !important;
            padding: 8px 20px; border-radius: 20px; border: 2px solid #3A98D8;
        }


        .form-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .report-container {
            background: #FFFFFF;
            width: 100%;
            max-width: 550px;

            padding: 0 40px 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px #1E293B14;
            box-sizing: border-box;
            overflow: hidden;
        }


        .report-container h2 {
            text-align: center;
            color: #FFFFFF;
            background-color: #3A98D8;
            /* Negative margin stretches it to the edges of the container */
            margin: 0 -40px 25px -40px;
            padding: 20px;
            font-size: 24px;
        }

        .form-notice {
            margin: -8px 0 20px;
            text-align: center;
            font-size: 14px;
        }


        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1E293B;
            font-size: 15px;
        }

        .form-group select,
        .form-group textarea,
        .form-group input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            background-color: #fafafa;
        }

        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3A98D8;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }


        .btn-submit {
            display: block;
            width: 100%;
            max-width: 150px;
            margin-left: auto;
            padding: 12px;
            background: linear-gradient(135deg, #3A98D8, #236FAE);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.3px;
            cursor: not-allowed;
            text-align: center;
            box-shadow: 0 6px 16px rgba(58, 152, 216, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-submit:disabled { opacity: 1; }


        footer {
            background-color: #1E293B; color: #FFFFFF;
            padding: 30px 20px; display: flex; justify-content: space-between; align-items: center;
            border-top: 4px solid #3A98D8;
        }
        .footer-links a { color: #FFFFFF; margin-right: 20px; font-size: 14px; }
        .footer-logo img { width: 60px; height: 60px; object-fit: contain; }


        @media (max-width: 700px) {
            .utility-bar { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
            .left-text, .logo-center, .utility-bar .right-links { flex: 1 1 100%; text-align: center; }
            .utility-bar .right-links a { display: inline-block; margin: 5px 8px; }
            .main-nav { flex-wrap: wrap; justify-content: center; gap: 12px; }
            .nav-links { flex: 1 1 100%; flex-wrap: wrap; justify-content: center; gap: 12px; }
            .report-container h2 { margin: 0 -20px 20px -20px; padding: 15px; }
            .report-container { padding: 0 20px 20px 20px; }
            footer { flex-direction: column; gap: 15px; text-align: center; }
            .footer-links a { display: inline-block; margin: 5px 10px; }
        }
    </style>
</head>
<body>


    <header class="site-header">
        <div class="utility-bar">
            <div class="left-text">This site is for reporting garbage in Kawempe only</div>
            <div class="logo-center"><img src="zone2560-logo.jpeg" alt="Logo"></div>
            <div class="right-links">
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact Us</a>
                <a href="admin%20login.html">Admin Login</a>
            </div>
        </div>
        <nav class="main-nav">
            <a href="index.html" class="home-link">Home</a>
            <div class="nav-links">
                <a href="waste_tips.html">Waste Tips</a>
                <a href="track.html">Track Reports</a>
                <a href="report.html" class="btn-report">Report Garbage</a>
            </div>
        </nav>
    </header>


    <div class="form-wrapper">
        <div class="report-container">

            <h2>Report Garbage</h2>
            <p class="form-notice">This is a visual demo. Reports are not submitted.</p>
            <div>

                <div class="form-group">
                    <label for="zone">Parish or zone (Enter location)</label>
                    <select id="zone">
                        <option value="" disabled selected></option>
                        <option value="kawempe-a">Kawempe Zone A</option>
                        <option value="bwaise">Bwaise</option>
                        <option value="mpererwe">Mpererwe</option>
                        <option value="kanyanya">Kanyanya</option>
                        <option value="kawempe-b">Kawempe Zone B</option>
                        <option value="busia">Busia</option>
                        <option value="katale">Katale</option>
                        <option value="kimwanyi">Kimwanyi</option>
                        <option value="lumumba">Lumumba</option>
                        <option value="mary-stuart">Mary Stuart</option>
                        <option value="mitchell">Mitchell</option>
                        <option value="erisa-zone">Erisa Zone</option>
                        <option value="nsooba-zone">Nsooba Zone</option>
                        <option value="kanyanya-quarters">Kanyanya Quarters</option>
                        <option value="katalemwa">Katalemwa</option>
                        <option value="lule-zone">Lule Zone</option>
                        <option value="industrial-area">Industrial Area</option>
                        <option value="ttula">Ttula</option>
                        <option value="katoogo">Katoogo</option>
                        <option value="bubajwe">Bubajwe</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="landmark">Nearby landmark</label>
                    <select id="landmark">
                        <option value="" disabled selected></option>
                        <option value="market">Main Market</option>
                        <option value="school">Primary School</option>
                        <option value="church">Church / Mosque</option>
                        <option value="road">Main Road</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description"></textarea>
                </div>

                <div class="form-group">
                    <label for="photo">Or report with a photo</label>
                    <input type="file" id="photo" accept="image/*">
                </div>


                <button type="button" class="btn-submit" disabled>Submit</button>

            </div>
        </div>

    </div>

    <footer>
        <div class="footer-links">
            <a href="about.html">About</a> <span aria-hidden="true">|</span>
            <a href="contact.html">Contact</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </div>
        <div class="footer-logo">
            <img src="zone2560-logo.jpeg" alt="Logo">
        </div>
    </footer>

</body>
</html>
